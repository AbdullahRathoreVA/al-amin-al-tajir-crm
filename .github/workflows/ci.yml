name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Migrations apply, roll back and re-apply
        run: node --disable-warning=ExperimentalWarning packages/server/src/db/migrate.ts verify

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: No secrets committed
        run: node scripts/scan-secrets.mjs
