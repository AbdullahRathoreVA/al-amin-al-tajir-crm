# Fly.io deployment for the Tiny Stars Command Center.
#
# Before the first deploy:
#   fly launch --no-deploy --name tiny-stars-crm
#   fly volumes create crm_data --size 1 --region yyz    # Toronto
#   fly secrets set CRM_SESSION_SECRET=... CRM_INGEST_SECRET=... CRM_ALLOWED_ORIGIN=...
#   fly deploy
#
# Secrets are set with `fly secrets`, never in this file. This file is committed.

app = "tiny-stars-crm"
primary_region = "yyz"

[build]

[env]
  CRM_DATA_DIR = "/data"
  CRM_HOST = "0.0.0.0"
  CRM_PORT = "4317"
  CRM_MODE = "production"

# The database is a single file on this volume. One machine writes it, which is
# why auto_stop below must never scale this past one instance.
[mounts]
  source = "crm_data"
  destination = "/data"

[http_service]
  internal_port = 4317
  force_https = true
  auto_start_machines = true

  # Never suspend, and never scale past one.
  #
  # min = 1 costs a little more than letting it sleep, and it is worth it. A
  # suspended machine has to cold start, and the website gives up forwarding a
  # registration after 6 seconds. The parent would still see "received" — the
  # confirmation is deliberately not blocked on delivery — while the CRM never
  # got it. A dropped registration is the one failure this system exists to
  # prevent.
  #
  # max = 1 because SQLite has one writer. Two machines would each mount their
  # own volume and diverge without ever saying so.
  auto_stop_machines = "off"
  min_machines_running = 1
  max_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
